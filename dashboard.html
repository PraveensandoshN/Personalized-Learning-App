<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Personalized Learning Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-bg">
  <header class="top-nav">
    <div>
      <h1>Recommendation Dashboard</h1>
      <p>Welcome to your personalized learning space.</p>
    </div>
    <button id="logoutBtn" class="btn-secondary">Logout</button>
  </header>

  <main class="dash-container">
    <section class="glass-card">
      <h2>Hello, <span id="currentUser">User</span> 👋</h2>
      <p>Select subjects on the left. Recommendations will update on the right.</p>
    </section>

    <section class="dashboard-grid">
      <section class="glass-card subject-panel">
        <h3>Subjects (Choose your interests)</h3>
        <ul id="subjectsList" class="choice-list"></ul>
      </section>

      <section class="glass-card recommendations-panel">
        <h3>Recommended Subjects for You</h3>
        <ul id="recommendationsList" class="recommend-list"></ul>
      </section>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
