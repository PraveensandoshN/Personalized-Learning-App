<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Personalized Learning Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-bg">
  <main class="login-shell">
    <section class="login-card">
      <div class="brand">
        <h1>Personalized Learning Portal</h1>
        <p>Secure access to your recommendation dashboard.</p>
      </div>

      <form id="loginForm" class="form-grid" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required />

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <p class="hint">Demo credentials → <strong>user</strong> / <strong>passs</strong></p>
      <p id="loginStatus" class="status"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
